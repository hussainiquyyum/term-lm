name: Bug report
description: Report a reproducible bug in term-lm.
body:
  - type: markdown
    attributes:
      value: |
        Issues are for reproducible bugs. Feature requests and questions belong in [Discussions](https://github.com/hussainiquyyum/term-lm/discussions).

        Keep this short: current behavior, expected behavior, the shortest reproduction, and your environment.

  - type: checkboxes
    id: bug-confirmation
    attributes:
      label: Is this a reproducible bug?
      description: Feature requests, ideas, questions, contribution proposals, and direction checks belong in Discussions and may be closed automatically if opened as issues.
      options:
        - label: I confirm this is a reproducible bug, not a feature request, idea, question, contribution proposal, or direction check.
          required: true
        - label: I reproduced this bug on the version and environment reported below using the exact steps provided.
          required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What is happening now? Describe what you observed, not a guessed cause.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: What are the shortest exact steps or commands that show the problem?
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How does this affect you?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: TERM-LM version, update channel, operating system, and terminal are required. Shell and relevant config are optional.
      value: |
        - TERM-LM version:
        - Update channel (stable or preview):
        - Operating system:
        - Terminal:
        - Shell, if relevant:
        - Relevant config, if any:
    validations:
      required: true
